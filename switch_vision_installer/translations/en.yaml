configuration:
  release_api_url:
    name: Custom release API URL
    description: Used only when Allow custom release source is enabled. Official releases use the quota-free GitHub release redirect and deterministic download paths.
  allow_custom_release_source:
    name: Allow custom release source
    description: Advanced option. Keep disabled for normal Switch Vision updates; enable only when intentionally using a custom release API.
  release_asset_pattern:
    name: Custom release asset pattern
    description: Filename pattern used only with an explicitly enabled custom release source. Official releases use deterministic asset names.
  preserve_custom_assets:
    name: Preserve custom assets
    description: Preserve custom logos and faceplates that do not conflict with bundled files.
  create_backup:
    name: Create backup
    description: Back up existing Switch Vision component folders before installation.
  allow_prerelease:
    name: Allow prereleases
    description: Permit installation from a GitHub release marked as prerelease.
