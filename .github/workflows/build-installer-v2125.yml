name: Build Installer v2.1.25 audit hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Prepare Installer v2.1.25
        run: |
          python tools/prepare_installer_v2125.py
          python tools/fix_v2125_test_version.py

      - name: Validate shell and frontend syntax
        run: |
          set -euo pipefail
          bash -n switch_vision_installer/run.sh
          node --check switch_vision_installer/www/installer.js
          node --check switch_vision_installer/www/component-manager.js

      - name: Compile all Python sources and regressions
        run: |
          python -m py_compile \
            switch_vision_installer/app/installer.py \
            switch_vision_installer/app/repository_setup.py \
            switch_vision_installer/app/web.py \
            switch_vision_installer/app/component_manager.py \
            switch_vision_installer/app/web_manager.py \
            tests/*.py

      - name: Run every permanent regression in isolated processes
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.py; do
            echo "::group::$test"
            python "$test"
            echo "::endgroup::"
          done

      - name: Validate version and audit-hardening contract
        run: |
          set -euo pipefail
          test "$(python - <<'PY'
          import re
          from pathlib import Path
          text=Path('switch_vision_installer/config.yaml').read_text()
          print(re.search(r'(?m)^version:\s*["\x27]?([^"\x27\s#]+)', text).group(1))
          PY
          )" = "2.1.25"
          grep -Fq 'INSTALLER_VERSION = "2.1.25"' switch_vision_installer/app/installer.py
          grep -Fq 'assert mod.INSTALLER_VERSION == "2.1.25"' tests/test_repository_backup_model.py
          grep -Fq 'tests/test_*.py' .github/workflows/validate.yaml
          grep -Fq 'test_v2_1_24_rate_limit_safe_release.py' <(printf '%s\n' tests/test_*.py)
          grep -Fq 'Custom release API URL' switch_vision_installer/translations/en.yaml
          grep -Fq "n===null||n===undefined||n===''" switch_vision_installer/www/installer.js
          git diff --check

      - name: Commit clean final source to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          rm -f .github/workflows/build-installer-v2125.yml tools/prepare_installer_v2125.py tools/fix_v2125_test_version.py
          git add -A
          git commit -m 'Release Switch Vision Installer v2.1.25'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
