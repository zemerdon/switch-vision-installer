name: Build Installer v2.1.24 final

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Installer v2.1.24
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Prepare v2.1.24 source
        run: python3 tools/prepare_installer_v2124_final.py

      - name: Compile Python
        run: |
          python3 -m py_compile \
            switch_vision_installer/app/installer.py \
            switch_vision_installer/app/repository_setup.py \
            switch_vision_installer/app/web.py \
            switch_vision_installer/app/component_manager.py \
            switch_vision_installer/app/web_manager.py \
            tests/test_repository_backup_model.py \
            tests/test_component_manager.py \
            tests/test_ui_state.py \
            tests/test_v2_1_19_hardening.py \
            tests/test_v2_1_20_atomic_replace.py \
            tests/test_v2_1_21_archive_http_limits.py \
            tests/test_v2_1_22_release_source_hardening.py \
            tests/test_v2_1_24_rate_limit_safe_release.py

      - name: Validate shell and frontend syntax
        run: |
          bash -n switch_vision_installer/run.sh
          node --check switch_vision_installer/www/installer.js
          node --check switch_vision_installer/www/component-manager.js

      - name: Validate existing regressions in isolated processes
        run: |
          set -euo pipefail
          python3 tests/test_repository_backup_model.py
          python3 tests/test_component_manager.py
          python3 tests/test_ui_state.py
          python3 tests/test_v2_1_19_hardening.py
          python3 tests/test_v2_1_20_atomic_replace.py
          python3 tests/test_v2_1_21_archive_http_limits.py
          python3 tests/test_v2_1_22_release_source_hardening.py

      - name: Validate v2.1.24 rate-limit-safe release path
        run: python3 tests/test_v2_1_24_rate_limit_safe_release.py

      - name: Validate release metadata and source hygiene
        run: |
          set -euo pipefail
          grep -q 'version: "2.1.24"' switch_vision_installer/config.yaml
          grep -q 'INSTALLER_VERSION = "2.1.24"' switch_vision_installer/app/installer.py
          grep -q '^## v2.1.24 ' switch_vision_installer/CHANGELOG.md
          ! grep -q 'api.github.com/repos/zemerdon/{repository}/releases/latest' switch_vision_installer/app/component_manager.py
          git diff --check

      - name: Commit final release source to PR branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          rm -f .github/workflows/build-installer-v2124-final.yml
          rm -f tools/prepare_installer_v2124_final.py
          git add -A
          if git diff --cached --quiet; then
            echo 'No prepared source changes to commit.'
            exit 0
          fi
          git commit -m 'Release Switch Vision Installer v2.1.24'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
