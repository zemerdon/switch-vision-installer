name: Validate Installer

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: |
          python -m py_compile \
            switch_vision_installer/app/installer.py \
            switch_vision_installer/app/repository_setup.py \
            switch_vision_installer/app/web.py \
            switch_vision_installer/app/component_manager.py \
            switch_vision_installer/app/web_manager.py \
            tests/*.py

      - name: Check shell syntax
        run: bash -n switch_vision_installer/run.sh

      - name: Check frontend syntax
        run: |
          node --check switch_vision_installer/www/installer.js
          node --check switch_vision_installer/www/component-manager.js

      - name: Run permanent regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.py; do
            echo "::group::$test"
            python "$test"
            echo "::endgroup::"
          done

      - name: Validate release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          config = Path("switch_vision_installer/config.yaml").read_text(encoding="utf-8")
          backend = Path("switch_vision_installer/app/installer.py").read_text(encoding="utf-8")
          changelog = Path("switch_vision_installer/CHANGELOG.md").read_text(encoding="utf-8")

          config_match = re.search(r"(?m)^version:\s*[\"']?([^\"'\s#]+)", config)
          backend_match = re.search(r'(?m)^INSTALLER_VERSION\s*=\s*"([^"]+)"', backend)

          assert config_match, "config.yaml version missing"
          assert backend_match, "INSTALLER_VERSION missing"

          config_version = config_match.group(1)
          backend_version = backend_match.group(1)

          assert config_version == backend_version, (
              f"Installer version mismatch: config={config_version}, backend={backend_version}"
          )
          assert f"## v{config_version}" in changelog, (
              f"CHANGELOG.md has no v{config_version} entry"
          )

          print(f"release metadata consistency: PASS (v{config_version})")
          PY
