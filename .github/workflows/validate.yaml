name: Validate Installer

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.release_metadata.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: |
          python -m py_compile \
            switch_vision_installer/app/installer.py \
            switch_vision_installer/app/repository_setup.py \
            switch_vision_installer/app/web.py \
            switch_vision_installer/app/component_manager.py \
            switch_vision_installer/app/web_manager.py \
            tests/*.py

      - name: Check shell syntax
        run: bash -n switch_vision_installer/run.sh

      - name: Check frontend syntax
        run: |
          node --check switch_vision_installer/www/installer.js
          node --check switch_vision_installer/www/component-manager.js

      - name: Run permanent regression suite
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.py; do
            echo "::group::$test"
            python "$test"
            echo "::endgroup::"
          done

      - name: Validate release metadata
        id: release_metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          config = Path("switch_vision_installer/config.yaml").read_text(encoding="utf-8")
          changelog = Path("switch_vision_installer/CHANGELOG.md").read_text(encoding="utf-8")
          dockerfile = Path("switch_vision_installer/Dockerfile").read_text(encoding="utf-8")
          web = Path("switch_vision_installer/app/web.py").read_text(encoding="utf-8")

          config_match = re.search(r"(?m)^version:\s*[\"']?([^\"'\s#]+)", config)
          assert config_match, "config.yaml version missing"
          config_version = config_match.group(1)

          assert f"## v{config_version}" in changelog, (
              f"CHANGELOG.md has no v{config_version} entry"
          )
          assert 'ENV SV_INSTALLER_VERSION=${BUILD_VERSION}' in dockerfile, (
              "Dockerfile must expose BUILD_VERSION as SV_INSTALLER_VERSION"
          )
          assert 'os.environ.get("SV_INSTALLER_VERSION")' in web, (
              "Installer web runtime must consume SV_INSTALLER_VERSION"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={config_version}\n")

          print(f"release metadata consistency: PASS (v{config_version})")
          PY

  container-build:
    name: Container build / ${{ matrix.arch }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build Installer container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./switch_vision_installer
          push: false
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BUILD_VERSION=${{ needs.validate.outputs.app_version }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: ghcr.io/zemerdon/switch-vision-installer:ci-${{ matrix.arch }}
