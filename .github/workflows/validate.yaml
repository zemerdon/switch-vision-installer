name: Validate Installer

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: |
          python -m py_compile \
            switch_vision_installer/app/installer.py \
            switch_vision_installer/app/repository_setup.py \
            switch_vision_installer/app/web.py \
            switch_vision_installer/app/component_manager.py \
            switch_vision_installer/app/web_manager.py \
            tests/test_repository_backup_model.py \
            tests/test_component_manager.py \
            tests/test_ui_state.py \
            tests/test_v2_1_19_hardening.py \
            tests/test_v2_1_20_atomic_replace.py \
            tests/test_v2_1_21_archive_http_limits.py

      - name: Check shell syntax
        run: bash -n switch_vision_installer/run.sh

      - name: Check frontend syntax
        run: |
          node --check switch_vision_installer/www/installer.js
          node --check switch_vision_installer/www/component-manager.js

      - name: Validate repository-era backup and restore
        run: python tests/test_repository_backup_model.py

      - name: Validate component manager
        run: python tests/test_component_manager.py

      - name: Validate UI and state
        run: python tests/test_ui_state.py

      - name: Validate v2.1.20 hardening
        run: python tests/test_v2_1_19_hardening.py

      - name: Validate crash-atomic replacement
        run: python tests/test_v2_1_20_atomic_replace.py

      - name: Validate archive and HTTP request hardening
        run: python tests/test_v2_1_21_archive_http_limits.py

      - name: Validate release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          config = Path("switch_vision_installer/config.yaml").read_text(encoding="utf-8")
          backend = Path("switch_vision_installer/app/installer.py").read_text(encoding="utf-8")
          changelog = Path("switch_vision_installer/CHANGELOG.md").read_text(encoding="utf-8")

          config_match = re.search(r"(?m)^version:\s*[\"']?([^\"'\s#]+)", config)
          backend_match = re.search(r'(?m)^INSTALLER_VERSION\s*=\s*"([^"]+)"', backend)

          assert config_match, "config.yaml version missing"
          assert backend_match, "INSTALLER_VERSION missing"

          config_version = config_match.group(1)
          backend_version = backend_match.group(1)

          assert config_version == backend_version, (
              f"Installer version mismatch: config={config_version}, backend={backend_version}"
          )
          assert f"## v{config_version}" in changelog, (
              f"CHANGELOG.md has no v{config_version} entry"
          )

          print(f"release metadata consistency: PASS (v{config_version})")
          PY
