name: Build Installer v2.1.24 rate-limit hotfix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare hotfix
        run: python3 tools/prepare_installer_v2124.py
      - name: Validate
        run: |
          set -euo pipefail
          python3 -m py_compile switch_vision_installer/app/installer.py switch_vision_installer/app/component_manager.py
          python3 -m unittest discover -s tests -p 'test*.py'
          grep -q 'version: "2.1.24"' switch_vision_installer/config.yaml
          grep -q 'INSTALLER_VERSION = "2.1.24"' switch_vision_installer/app/installer.py
          ! grep -q 'api.github.com/repos/zemerdon/{repository}/releases/latest' switch_vision_installer/app/component_manager.py
          git diff --check
      - name: Commit final source back to hotfix branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'switch-vision-release-bot'
          git config user.email 'switch-vision@users.noreply.github.com'
          rm -f .github/workflows/build-installer-v2124.yml tools/prepare_installer_v2124.py
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Release Switch Vision Installer v2.1.24'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
